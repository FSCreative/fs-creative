<title>FS Cockpit</title>

<style>
/* Layout: Seitenleiste (Desktop) bzw. Tab-Leiste unten (Handy); "Heute" als priorisierte Liste; Abgleich als Tabelle je Quelle. */
:root{
  /* Look „Montafon Night“ (dunkel) bzw. „Montafon Day“ (hell): Indigo als einzige Akzentfarbe, Plus Jakarta Sans, Zahlen in JetBrains Mono */
  --ground:#f4f5f8; --rail:#ffffff; --panel:#ffffff; --panel-2:#f8f9fc; --sunk:#eef0f5; --active:#eef0fe; --ink:#11141b; --ink-2:#4a5263; --ink-3:#5f6778; --line:#e3e6ee; --line-2:#d5d9e3;
  --glow:#4f5bd5; --glow-ink:#3a44a8; --glow-soft:#eef0fe; --on-glow:#ffffff; --sel:#dfe3fd;
  --ok:#0f8a5f; --ok-soft:#e1f4ec; --warn:#b45309; --warn-soft:#fdf0e1; --bad:#c2364b; --bad-soft:#fbe7ea; --info:#4f5bd5; --info-soft:#eef0fe; --pink:#a21caf;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 2px 8px rgba(16,24,40,.05); --shadow-pop:0 24px 60px rgba(16,24,40,.18);
  --f-display:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --f-body:"Plus Jakarta Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --r-sm:9px; color-scheme:light;
  /* Glas-Tokens (Alpenglas): in hell/dunkel so belegt, dass alles wie bisher aussieht */
  --panel-solid:var(--panel); --glass:var(--panel); --glass-strong:var(--panel); --glass-line:var(--line); --glass-hi:0 0 0 0 transparent; --glass-blur:none;
  --field:var(--panel); --hover:var(--sunk);
  --glass-bar:color-mix(in srgb,var(--ground) 88%,transparent); --bar-blur:saturate(1.6) blur(14px);   /* klebende Kopfleisten (Handy) */
  --btn-pri:var(--glow); --btn-pri-ink:var(--on-glow);                                                 /* Haupt-Knopf */
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#0b0e14; --rail:#0e121a; --panel:#121620; --panel-2:#171c28; --sunk:#1a1f2b; --active:#1b2131; --ink:#eef1f7; --ink-2:#a3abbd; --ink-3:#8a93a8; --line:#1f2533; --line-2:#2a3142;
  --glow:#7b8bff; --glow-ink:#c4cbff; --glow-soft:rgba(123,139,255,.16); --on-glow:#0b0e14; --sel:rgba(123,139,255,.24);
  --ok:#3ecf8e; --ok-soft:rgba(62,207,142,.14); --warn:#f5a524; --warn-soft:rgba(245,165,36,.14); --bad:#f87171; --bad-soft:rgba(248,113,113,.14); --info:#7b8bff; --info-soft:rgba(123,139,255,.14); --pink:#e879f9;
  --shadow:none; --shadow-pop:0 24px 60px rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ground:#0b0e14; --rail:#0e121a; --panel:#121620; --panel-2:#171c28; --sunk:#1a1f2b; --active:#1b2131; --ink:#eef1f7; --ink-2:#a3abbd; --ink-3:#8a93a8; --line:#1f2533; --line-2:#2a3142;
  --glow:#7b8bff; --glow-ink:#c4cbff; --glow-soft:rgba(123,139,255,.16); --on-glow:#0b0e14; --sel:rgba(123,139,255,.24);
  --ok:#3ecf8e; --ok-soft:rgba(62,207,142,.14); --warn:#f5a524; --warn-soft:rgba(245,165,36,.14); --bad:#f87171; --bad-soft:rgba(248,113,113,.14); --info:#7b8bff; --info-soft:rgba(123,139,255,.14); --pink:#e879f9;
  --shadow:none; --shadow-pop:0 24px 60px rgba(0,0,0,.5); color-scheme:dark;
}
:root[data-theme="light"]{ color-scheme:light; }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--glow);outline-offset:2px;border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:-.02em;margin:0;text-wrap:balance}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px;padding:22px 14px;border-right:1px solid var(--line);background:var(--panel)}
.brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px;font-family:var(--f-display);font-weight:700;font-size:18px}
.brand img{width:30px;height:30px;border-radius:50%;background:#1b2420;padding:4px}
.nav-btn{display:flex;align-items:center;gap:11px;width:100%;padding:9px 10px;border:0;background:none;border-radius:var(--r-sm);color:var(--ink-2);font-weight:500;text-align:left}
.nav-btn svg{width:18px;height:18px;flex:none}
.nav-btn:hover{background:var(--sunk);color:var(--ink)}
.nav-btn[aria-current="page"]{background:var(--ink);color:var(--ground)}
.count{margin-left:auto;font-family:var(--f-mono);font-size:12px;padding:1px 7px;border-radius:99px;background:var(--glow);color:var(--on-glow)}
.rail-foot{margin-top:auto;display:grid;gap:6px;padding:0 4px;font-size:13px}
.rail-foot a,.rail-foot button{display:flex;align-items:center;gap:8px;color:var(--ink-2);text-decoration:none;border:0;background:none;padding:6px;border-radius:8px;text-align:left}
.rail-foot a:hover,.rail-foot button:hover{background:var(--sunk);color:var(--ink)}
.rail-foot select{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:5px 8px}
.stamp{font-size:12px;color:var(--ink-3);padding:0 6px}

main{padding-block:28px 110px;padding-inline:clamp(16px,4vw,44px);min-width:0}
.view{max-width:1180px;margin:0 auto;display:grid;gap:22px}
.view>*{min-width:0}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.head h1{font-size:clamp(26px,3.6vw,38px);line-height:1.08}
.head p{margin:6px 0 0;color:var(--ink-2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:17px}
.panel-b{padding:14px 18px}
.muted{color:var(--ink-3);font-size:13px}
.small{font-size:13px}
.link{border:0;background:none;color:var(--ink-2);font-size:13px;font-weight:600;padding:4px 0;text-decoration:none}
.link:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel);padding:6px 12px;border-radius:99px;font-size:13px;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-3)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.btn.glow{background:var(--glow);border-color:var(--glow);color:var(--on-glow)}
.btn svg{width:15px;height:15px}
.tag{display:inline-block;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)} .tag.info{background:var(--info-soft);color:var(--info)} .tag.glow{background:var(--glow-soft);color:var(--glow-ink)} .tag.ok{background:var(--ok-soft);color:var(--ok)} .tag.grey{background:var(--sunk);color:var(--ink-2)}
.empty{padding:22px 18px;color:var(--ink-3);text-align:center}
.notice{padding:12px 16px;border-radius:var(--r);background:var(--warn-soft);color:var(--ink);display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
input.f,select.f,textarea.f{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:8px 11px;width:100%;min-width:0}
textarea.f{resize:vertical}
label.fl{display:grid;gap:5px;font-size:13px;color:var(--ink-2)}

/* Tagesleiste */
.day{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.day > button{background:var(--panel);padding:14px 18px;display:grid;gap:2px;border:0;text-align:left}
.day > button:hover{background:var(--sunk)}
.k{font-size:12px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.v{font-family:var(--f-display);font-size:26px;font-weight:700;line-height:1.15}
.s{font-size:12.5px;color:var(--ink-2)}

/* Liste "Heute" */
.feed{list-style:none;margin:0;padding:0}
.item{display:grid;grid-template-columns:4px 36px minmax(0,1fr) auto;gap:14px;align-items:center;padding:13px 18px 13px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.sev{align-self:stretch;border-radius:0 4px 4px 0}
.sev.bad{background:var(--bad)} .sev.warn{background:var(--warn)} .sev.info{background:var(--info)} .sev.glow{background:var(--glow)} .sev.ok{background:var(--ok)}
.ico{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:var(--sunk);color:var(--ink-2)}
.ico svg{width:18px;height:18px}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .t .tag{margin-right:6px;vertical-align:1px}
.item .d{font-size:13px;color:var(--ink-2);min-width:0;overflow-wrap:anywhere}
.item .acts{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
@media (max-width:1280px){.item{grid-template-columns:4px 36px minmax(0,1fr);row-gap:8px}.item .acts{grid-column:3;justify-content:flex-start}}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.more{display:block;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:10px;color:var(--ink-2);font-weight:600;font-size:13px}

.two{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:22px;align-items:start}
.stack{display:grid;gap:22px;min-width:0}
.agenda{list-style:none;margin:0;padding:4px 18px 12px}
.agenda li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:12px;padding:9px 0;border-bottom:1px dashed var(--line)}
.agenda li:last-child{border-bottom:0}
.agenda .time{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);padding-top:1px}
.dayhead{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;padding:12px 18px 0}
.todo{display:flex;gap:10px;align-items:flex-start;padding:8px 18px}
.todo input{margin-top:4px;width:17px;height:17px;accent-color:var(--ok);flex:none}
.todo .due{font-size:12px;color:var(--ink-3)}
.todo .due.late{color:var(--bad);font-weight:600}
.todo-add{display:flex;gap:8px;padding:10px 18px 14px}

/* Pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--sunk);border-radius:var(--r);padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;justify-content:space-between;align-items:baseline;padding:4px 6px 6px;font-weight:600;font-size:13.5px}
.col-h .num{color:var(--ink-3);font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px 12px;display:grid;gap:5px;text-align:left;width:100%}
.card:hover{border-color:var(--ink-3)}
.card .n{font-weight:600;overflow-wrap:anywhere}
.card .m{font-size:12.5px;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.card .x{font-size:12px;color:var(--ink-3)}

/* Geld */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{padding:16px 18px;display:grid;gap:4px}
.chart{padding:8px 18px 14px}
.chart svg{width:100%;height:auto;display:block}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:600;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 14px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
td .sub{font-size:12.5px;color:var(--ink-3)}
tr.grp td{background:var(--sunk);font-weight:700;font-size:13px;padding:8px 14px}
.invs{display:flex;flex-direction:column;gap:3px;font-size:12.5px}
.invs a{text-decoration:none}
.invs a:hover{text-decoration:underline}
.bar{height:8px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ink)}
.accs{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;padding:14px 18px}
.acc{border:1px solid var(--line);border-radius:11px;padding:10px 12px}

/* Websites */
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ink-3);margin-right:8px;vertical-align:1px}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.warn{background:var(--warn)}
.pos{color:var(--ok)} .neg{color:var(--bad)}

/* Plattformen */
.plats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.plat{padding:18px;display:grid;gap:10px;align-content:start}
.plat-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.facts{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;font-size:14px;margin:0}
.facts dt{color:var(--ink-2)} .facts dd{margin:0;text-align:right}

/* Postfach */
.mailgrid{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:16px;align-items:start}
.mlist{max-height:calc(100vh - 220px);overflow-y:auto}
.mrow{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;padding:11px 14px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.mrow:hover{background:var(--sunk)}
.mrow[aria-current="true"]{background:var(--glow-soft)}
.mrow .from{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .sub{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow.read .from{font-weight:500;color:var(--ink-2)}
.udot{width:8px;height:8px;border-radius:50%;background:var(--glow);margin-top:7px}
.mrow.read .udot{background:transparent}
.mview{padding:18px;display:grid;gap:12px;min-width:0}
.mview iframe{width:100%;min-height:420px;border:1px solid var(--line);border-radius:10px;background:#fff}
.mbody{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px}
.atts{display:flex;flex-wrap:wrap;gap:6px}

/* Drawer + Dialoge */
.scrim{position:fixed;inset:0;background:rgba(10,14,12,.4);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(500px,100%);background:var(--panel);border-left:1px solid var(--line);transform:translateX(100%);transition:transform .25s ease;z-index:50;overflow-y:auto;padding:calc(20px + env(safe-area-inset-top,0px)) 22px calc(28px + env(safe-area-inset-bottom,0px));display:grid;gap:16px;align-content:start}
.drawer.on{transform:none}
.drawer h2{font-size:24px}
.stages{display:flex;gap:4px}
.stages button{flex:1;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-size:11.5px;font-weight:600;color:var(--ink-2);padding:0 2px}
.stages button.on{background:var(--glow);border-color:var(--glow);color:var(--on-glow)}
.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:7px 12px;font-size:14px;margin:0}
.kv dt{color:var(--ink-3)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sec-t{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-3);font-weight:600;margin-bottom:6px}
.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:70;padding:16px;background:rgba(10,14,12,.45)}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(720px,100%);max-height:calc(100vh - 32px);overflow-y:auto;padding:20px;display:grid;gap:14px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.irow{display:grid;grid-template-columns:minmax(0,2.2fr) 70px 110px 80px 34px;gap:6px;align-items:start}
.irow .t2{grid-column:1/-1}
.dialog .foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;align-items:center}
.err{color:var(--bad);font-size:13.5px}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;opacity:0;transition:.2s;z-index:90;pointer-events:none;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--bad);color:#fff}
.loading{display:grid;place-items:center;min-height:50vh;color:var(--ink-3)}

.tabbar{display:none}
.tb-items{display:flex;flex:1;min-width:0;position:relative;z-index:1}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-block:16px 112px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--panel);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--ink-3);padding:4px 0;position:relative}
  .tabbar svg{width:22px;height:22px}
  .tabbar button[aria-current="page"]{color:var(--ink)}
  .tabbar .count{position:absolute;top:0;left:calc(50% + 6px);margin:0;font-size:10px;padding:0 5px}
  .two,.mailgrid{grid-template-columns:minmax(0,1fr)}
  .day{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .plats,.grid2{grid-template-columns:minmax(0,1fr)}
  .item{grid-template-columns:4px 32px minmax(0,1fr);row-gap:8px}
  .item .acts{grid-column:3;justify-content:flex-start}
  .mlist{max-height:none}
  .irow{grid-template-columns:64px minmax(0,1fr) 86px 40px;padding:10px;border:1px solid var(--line);border-radius:12px}
  .irow [data-i=name]{grid-column:1/-1} .irow .del{grid-column:4;height:100%;min-height:40px;border:0;background:var(--sunk)}
  .dialog .foot>.row,.dialog .foot>.btns{display:flex;gap:8px;flex:1 1 100%;margin:0}.dialog .foot>.row .btn,.dialog .foot>.btns .btn{flex:1;justify-content:center;min-height:46px}
  .hide-m{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---- Ergänzungen v2 ---- */

body.priv .money,body.priv .num.v,body.priv .kpi .v,body.priv .day .v,body.priv td.r.num,body.priv .chart svg rect{filter:blur(7px)}

/* ===== Look „Montafon Night“ (Wunsch Simon 19.10.2026): breite Seitenleiste mit Gruppen, Suche + „Neu“ oben im Inhalt, Statusleiste rechts,
   Indigo als einzige Akzentfarbe, ruhige Karten mit feinem Rahmen; hell = „Montafon Day“ ===== */
:root{--rail-w:244px;--top-h:calc(72px + env(safe-area-inset-top,0px))}   /* Statusleiste (App am iPad/iPhone) zählt zur Kopfzeile; am Mac 0 */
body{font-size:14px;letter-spacing:-.003em}
.app{display:grid;grid-template-columns:var(--rail-w) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);grid-template-areas:"rail top" "rail main";min-height:100vh}
.rail{grid-area:rail;position:sticky;top:0;height:100vh;display:block;padding:0;background:var(--rail);border-right:1px solid var(--line);overflow:hidden}
/* innen: Marke oben und Einstellungen/Profil unten bleiben stehen, nur die Bereiche scrollen (außen bleiben Glas, Glanz und Rand) */
.rail-in{position:relative;z-index:1;height:100%;display:flex;flex-direction:column;gap:2px;padding:calc(20px + env(safe-area-inset-top,0px)) 14px 14px;overflow:hidden}
.nav-sc{position:relative;flex:1 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:none;margin:0 -4px;padding:0 4px 4px}
.nav-sc::-webkit-scrollbar{display:none}
.ru-n b,.ru-n small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 12px;font:700 16.5px/1 var(--f-display);color:var(--ink);letter-spacing:-.015em}
.brand .bm{width:30px;height:30px;border-radius:9px;background:var(--glow);color:var(--on-glow);display:grid;place-items:center;font-size:11.5px;font-weight:800;letter-spacing:0;flex:none}
.rail #nav{display:grid;gap:2px}
.nav-g{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:700;padding:16px 10px 6px}
.rail .nav-btn{position:relative;display:flex;align-items:center;gap:11px;width:100%;padding:8px 10px;border:0;border-radius:9px;background:none;color:var(--ink-2);font-weight:500;font-size:14px;text-align:left;line-height:1.3}
.rail .nav-btn svg{width:18px;height:18px;flex:none}
.rail .nav-btn:hover{background:var(--sunk);color:var(--ink)}
.rail .nav-btn[aria-current="page"]{background:var(--active);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--glow)}
.rail .nav-btn[aria-current="page"] svg{color:var(--glow)}
.rail .nav-btn .count{margin-left:auto;font:600 11px/18px var(--f-mono);min-width:20px;padding:0 6px;text-align:center;border-radius:99px}
.rail-set{display:flex;gap:6px;padding:14px 4px 10px;margin-top:auto}
.rail-set select{flex:1;min-width:0;height:32px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink-2);padding:0 6px;font-size:12.5px}
.rail-user{display:flex;align-items:center;gap:10px;padding:12px 6px 2px;border-top:1px solid var(--line)}
.ru-av{width:34px;height:34px;border-radius:50%;background:var(--sunk);color:var(--ink);display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}
.ru-n{display:grid;min-width:0;flex:1;line-height:1.3}.ru-n b{color:var(--ink);font-weight:600;font-size:13.5px}.ru-n small{color:var(--ink-3);font-size:12px}
.ru-out{position:relative;width:30px;height:30px;padding:0;border:0;background:none;border-radius:8px;display:grid;place-items:center;color:var(--ink-3);flex:none}.ru-out:hover{background:var(--sunk);color:var(--ink)}.ru-out svg{width:16px;height:16px}
.ru-me{display:flex;align-items:center;gap:10px;flex:1;min-width:0;margin:-4px;padding:4px;border:0;border-radius:12px;background:none;color:inherit;font:inherit;text-align:left}
.ru-me:hover{background:var(--sunk)}
.ru-me.bad small{color:var(--bad);font-weight:600}
.ru-av{position:relative}
.ru-dot,.tb-dot{position:absolute;top:3px;right:3px;width:8px;height:8px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--rail)}
.ru-av .ru-dot{top:-2px;right:-2px;width:11px;height:11px}
.count{background:var(--glow);color:var(--on-glow)}

/* Kopfzeile im Inhaltsbereich: Suche, Werkzeuge, „+ Neu“ */
.topbar{grid-area:top;position:sticky;top:0;z-index:35;display:flex;align-items:center;gap:8px;height:var(--top-h);padding:env(safe-area-inset-top,0px) clamp(16px,2.6vw,36px) 0;background:color-mix(in srgb,var(--ground) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.tb-search{flex:1;min-width:140px;display:flex;align-items:center;gap:10px;height:42px;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink-3);padding:0 12px 0 14px;font-size:14px;text-align:left;box-shadow:var(--shadow)}
.tb-search:hover{border-color:var(--line-2)}
.tb-search svg{width:16px;height:16px;flex:none}
.tb-search span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tb-search kbd{font:600 11px var(--f-mono);color:var(--ink-3);border:1px solid var(--line-2);border-radius:6px;padding:1px 6px}
.tb-right{display:flex;align-items:center;gap:8px;min-width:0}
.tb-right .stamp{color:var(--ink-3);font-size:12px;padding:0 4px;white-space:nowrap}
.topbar .rail-foot{margin:0;padding:0;font-size:13px}
.topbar .rail-foot .rf-ic,.topbar .tb-i{position:relative;width:42px;height:42px;padding:0;border:1px solid var(--line);border-radius:11px;background:var(--panel);color:var(--ink-2);display:grid;place-items:center;box-shadow:var(--shadow);flex:none}
.topbar .rail-foot .rf-ic:hover,.topbar .tb-i:hover{color:var(--ink);border-color:var(--line-2);background:var(--panel)}
.topbar .rail-foot .rf-ic span{display:none}
.topbar .rail-foot .rf-ic svg,.topbar .tb-i svg{width:18px;height:18px}
.topbar .rail-foot .rf-ic[aria-pressed="true"]{color:var(--glow);border-color:color-mix(in srgb,var(--glow) 45%,var(--line))}
.topbar .rail-foot .rf-new{width:auto;display:flex;gap:6px;padding:0 14px;background:var(--glow-soft);color:var(--glow-ink);border-color:transparent;font-weight:700}
.topbar .rail-foot .rf-new span{display:inline}
.topbar .rail-foot .rf-new:hover{background:var(--glow-soft);color:var(--glow-ink)}
.tb-new{height:42px;border:0;border-radius:11px;background:var(--glow);color:var(--on-glow);font-weight:700;font-size:14px;padding:0 18px;white-space:nowrap;display:flex;align-items:center;gap:6px;flex:none}
.tb-new:hover{filter:brightness(1.08)}
.tb-new svg{width:16px;height:16px}
@media (max-width:1500px){.tb-right .stamp{display:none}}
.nmenu{position:fixed;z-index:80;min-width:240px;background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow-pop);padding:6px;display:grid;gap:1px}
.nmenu button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:8px;padding:9px 10px;text-align:left;color:var(--ink);font-weight:500}
.nmenu button:hover,.nmenu button:focus-visible{background:var(--sunk)}
.nmenu button svg{width:17px;height:17px;color:var(--ink-3);flex:none}
.nmenu button kbd{margin-left:auto;font:600 10.5px var(--f-mono);color:var(--ink-3)}
.nmenu hr{border:0;border-top:1px solid var(--line);margin:4px 2px}

/* Inhalt */
main{grid-area:main;padding-block:6px 80px;padding-inline:clamp(16px,2.6vw,36px);min-width:0}
.view{max-width:1400px;gap:18px}
.head{align-items:flex-end;padding:6px 0 2px}
.head h1{font-size:30px;font-weight:700;letter-spacing:-.025em;line-height:1.1;color:var(--ink)}
.head p{margin:6px 0 0;font-size:14px;color:var(--ink-2)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.panel-h{padding:15px 18px;border-bottom:1px solid var(--line)}
.panel-h h2{font-size:15.5px;font-weight:700;letter-spacing:-.01em;color:var(--ink)}
.link{color:var(--glow);font-weight:600}
.link:hover{color:var(--glow);text-decoration:underline}
.btn{border-radius:10px;padding:6px 14px;font-weight:600;font-size:13px;min-height:34px;background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.btn:hover{border-color:var(--line-2);background:var(--sunk)}
.btn.primary{background:var(--glow);border-color:var(--glow);color:var(--on-glow)}
.btn.primary:hover{background:var(--glow);border-color:var(--glow);filter:brightness(1.08)}
.btn.glow{background:var(--glow-soft);border-color:transparent;color:var(--glow-ink)}
.btn.icon{min-height:34px}
.chip{border-radius:99px}
.chip[aria-pressed="true"],.seg button[aria-pressed="true"]{background:var(--glow-soft);color:var(--glow-ink);border-color:color-mix(in srgb,var(--glow) 40%,transparent)}
.seg{border-radius:10px;border-color:var(--line);background:var(--panel)}
.subnav{gap:2px;border-bottom:1px solid var(--line);padding-bottom:0}
.subnav button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:9px 12px;color:var(--ink-2)}
.subnav button:hover{color:var(--ink);background:none}
.subnav button[aria-current="true"]{background:none;border-color:var(--glow);color:var(--ink)}
input.f,select.f,textarea.f{border-radius:9px;background:var(--field);border-color:var(--line);color:var(--ink)}
select.f{background-color:var(--panel-solid)}
input.f:focus,select.f:focus,textarea.f:focus{outline:none;border-color:var(--glow);box-shadow:0 0 0 3px var(--glow-soft)}
input.f::placeholder,textarea.f::placeholder{color:var(--ink-3)}
:focus-visible{outline-color:var(--glow)}
.tag{border-radius:99px;font-weight:600}
th{color:var(--ink-3)}
.dialog{border-radius:16px;border:1px solid var(--line);box-shadow:var(--shadow-pop)}
.modal{background:rgba(5,7,12,.55);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
.scrim{background:rgba(5,7,12,.5)}
.drawer{border-left:1px solid var(--line);box-shadow:-12px 0 32px rgba(0,0,0,.25)}
.toast{border-radius:11px}
.notice{border-radius:12px;border:1px solid color-mix(in srgb,var(--warn) 30%,transparent)}
/* Kennzahlen als einzelne Karten */
.day{grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;background:none;border:0;border-radius:0;overflow:visible}
.day>button{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);gap:4px}
.day>button:hover{background:var(--panel);border-color:var(--line-2)}
.k{font-size:13px;text-transform:none;letter-spacing:0;color:var(--ink-2);font-weight:500}
.v{font-family:var(--f-mono);font-size:27px;font-weight:600;color:var(--ink);letter-spacing:-.03em}
.s{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.kpi .v{font-size:24px}
.bar i{background:var(--glow)}
/* Zahlen: in Tabellen und Listen die Grundschrift mit gleich breiten Ziffern, Mono nur für große Kennzahlen und Zähler */
.num{font-family:var(--f-body);font-variant-numeric:tabular-nums;letter-spacing:0}
.v.num,.kpi .v,.count{font-family:var(--f-mono)}
.pipe{grid-template-columns:repeat(5,minmax(168px,1fr))}
/* Postfach und Kalender füllen am PC den ganzen Bildschirm */
@media (min-width:901px){
  main:has(>.view-post),main:has(>.view-kal .kd){height:calc(100vh - var(--top-h));display:flex;flex-direction:column;padding-block:2px 14px;padding-inline:clamp(14px,1.6vw,22px)}
  main>.view-post,main>.view-kal:has(.kd){flex:1;min-height:0;max-width:none;width:100%;display:flex;flex-direction:column;gap:12px}
  .view-post>.mbox{flex:1;min-height:0;align-items:stretch}
  .view-post .mfold,.view-post .mread{position:static!important;max-height:none!important;height:100%;min-height:0}
  .view-post .mlistp{position:relative!important;max-height:none!important;height:100%;min-height:0}
  .view-post .mfold{overflow-y:auto}
  .view-post .mframe{height:max(420px,calc(100vh - 420px))}
  .view-kal>.kd{flex:1;min-height:0;align-items:stretch}
  .view-kal .kd-side{position:static;overflow-y:auto}
  .view-kal .kd-main{display:flex;flex-direction:column;min-height:0;overflow:auto}
  .view-kal .kw-scroll{flex:1;max-height:none;min-height:0}
}
/* Mittlere Breite: Seitenleiste nur mit Symbolen */
@media (min-width:901px) and (max-width:1180px){
  :root{--rail-w:76px}
  .rail-in{padding:calc(16px + env(safe-area-inset-top,0px)) 8px 10px;align-items:stretch}
  .brand{justify-content:center;padding:0 0 10px}.brand b{display:none}
  .nav-g{font-size:0;padding:8px 0 4px;border-top:1px solid var(--line);margin:6px 10px 0}
  .nav-g:first-child{border-top:0;margin-top:0}
  .rail .nav-btn{justify-content:center;padding:10px 0}
  .rail .nav-btn .nl{display:none}
  .rail .nav-btn .count{position:absolute;top:2px;right:6px;margin:0;font-size:10px;line-height:16px;min-width:16px;padding:0 4px}
  .rail-set{display:none}
  .rail-user{flex-direction:column;justify-content:center;gap:4px;padding:10px 0 0}.ru-n,.rail-user a.ru-out{display:none}.ru-me{flex:none;margin:0;justify-content:center}
}
/* Handy: Reiter unten, keine Seitenleiste/Kopfzeile (eigene Kopfzeilen je Seite) */
@media (max-width:900px){
  .app{display:block;min-height:100%}
  .rail,.topbar{display:none}
  main{padding-block:16px 112px}
  .panel{box-shadow:none}
  .subnav{border-bottom:0;gap:6px}
  .subnav button{border:1px solid var(--line);border-radius:99px;padding:6px 14px;background:var(--panel)}
  .subnav button[aria-current="true"]{background:var(--glow-soft);color:var(--glow-ink);border-color:color-mix(in srgb,var(--glow) 40%,transparent)}
  .btn{border-radius:99px}
  .head h1{font-size:26px}
  .tabbar{background:color-mix(in srgb,var(--rail) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
  .tabbar button[aria-current="page"]{color:var(--glow)}
  .tabbar .count{background:var(--glow);color:var(--on-glow)}
}
/* ===== Text-Aufteilung (alle Themes): Überschriften ausgeglichen, Fließtext ohne Schusterjungen, Silbentrennung (lang="de") ===== */
h1,h2,h3,h4,.panel-h h2,.sec-t{text-wrap:balance}
p,li,dd,blockquote,figcaption,.muted,.notice,.empty,.item .d{text-wrap:pretty}
p,li,dd,td,blockquote,figcaption,.notice,.empty{-webkit-hyphens:auto;hyphens:auto;hyphenate-limit-chars:7 3 3}
button,.btn,.nav-btn,.chip,.tag,.count,.link,th,kbd,code,pre,input,select,textarea,.num,.v,.k{-webkit-hyphens:manual;hyphens:manual}
/* Hilfsklassen: .ell einzeilig mit „…“ (bitte title-Attribut mitgeben), .anyw lange Wörter/E-Mails umbrechen, .tnum gleich breite Ziffern, .clamp2/.clamp3 Zeilen begrenzen */
.ell{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.anyw,a[href^="mailto:"]{overflow-wrap:anywhere}
.tnum,.count,.v,.num,time,td.r,th.r{font-variant-numeric:tabular-nums}
.clamp2,.clamp3{display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden}
.clamp2{-webkit-line-clamp:2;line-clamp:2}.clamp3{-webkit-line-clamp:3;line-clamp:3}

/* ===== Liquid-Glas-Navigation: ein „Tropfen“ markiert den aktiven Eintrag (core.js bewegt ihn per Feder; hier nur das Aussehen).
   Hell/Dunkel: sieht aus wie die bisherige Markierung, nur animiert. ===== */
.lq-glare{display:none}
.lq-drop{position:absolute;left:0;top:0;z-index:0;pointer-events:none;transform-origin:50% 50%;will-change:transform;transition:opacity .2s ease}
.lq-drop.off{opacity:0}
.lq-drop>i{position:absolute;inset:0;border-radius:9px;background:var(--active);box-shadow:inset 3px 0 0 var(--glow);transition:transform .55s cubic-bezier(.3,1.7,.45,1),background-color .2s,box-shadow .2s,opacity .2s}
.lq-drop.away>i{background:var(--sunk);box-shadow:none}
.lq-drop.press>i{transform:scale(.94);transition-duration:.14s}
.rail.lq-on .nav-btn[aria-current="page"]{background:transparent;box-shadow:none}
.rail.lq-hov .nav-btn:hover{background:transparent}
.rail .nav-btn{z-index:1;transition:transform .4s cubic-bezier(.3,1.6,.5,1),color .15s}
.rail .nav-btn:active{transform:scale(.97)}
.tabbar .lq-drop>i{border-radius:14px;background:var(--glow-soft);box-shadow:none}
.tabbar .lq-drop.away>i{background:var(--sunk)}
.tabbar button{z-index:1;transition:transform .35s cubic-bezier(.3,1.6,.5,1),color .15s}
.tabbar button:active{transform:scale(.93)}
.tabbar button.lq-near{color:var(--ink)}
.tabbar .tb-dot{top:1px;left:calc(50% + 7px);right:auto;box-shadow:0 0 0 2px var(--panel)}

/* ===== Look „Alpenglas“ (Wunsch Simon 27.10.2026): Bergfoto, Milchglas, weiße Schrift, Cyan-Akzent – Standard-Theme „glas“.
   Unschärfe (backdrop-filter) nur auf wenigen obersten Flächen: Leiste, Kopfzeile, Karten der obersten Ebene, Overlays.
   Nie auf main/.view/.fsd/.fsm/.mbox/.mread/Kalender – dort hängen fixierte Knöpfe und Leisten. ===== */
:root[data-theme="glas"]{
  --ground:#0b1220; --rail:rgba(14,22,34,.38); --panel:rgba(255,255,255,.075); --panel-2:rgba(255,255,255,.1); --sunk:rgba(255,255,255,.065); --active:rgba(255,255,255,.16);
  --ink:#f4f7fb; --ink-2:rgba(236,242,250,.8); --ink-3:rgba(226,235,245,.62); --line:rgba(255,255,255,.13); --line-2:rgba(255,255,255,.22);
  --glow:#9ff0ff; --glow-ink:#c9f7ff; --glow-soft:rgba(159,240,255,.16); --on-glow:#06202a; --sel:rgba(159,240,255,.22);
  --ok:#5eeaa8; --ok-soft:rgba(94,234,168,.16); --warn:#ffc566; --warn-soft:rgba(255,197,102,.16);
  --bad:#ff7a85; --bad-soft:rgba(255,122,133,.18); --info:#9ff0ff; --info-soft:rgba(159,240,255,.14); --pink:#f0abfc;
  --shadow:0 18px 50px rgba(0,0,0,.28); --shadow-pop:0 30px 80px rgba(0,0,0,.5);
  --r:22px; --r-sm:12px;
  --panel-solid:#131b28; --glass:rgba(255,255,255,.085); --glass-strong:rgba(16,24,37,.74);
  --glass-line:rgba(255,255,255,.2); --glass-hi:inset 0 1px 0 rgba(255,255,255,.28); --glass-blur:blur(28px) saturate(170%);
  --field:rgba(0,0,0,.26); --hover:rgba(255,255,255,.08);
  --glass-bar:rgba(11,18,30,.42); --bar-blur:blur(24px) saturate(170%);
  --btn-pri:#fff; --btn-pri-ink:#0d1520;
  --rail-w:262px;
  /* Liquid Glass: Lichtkante oben links, dunklere Kante unten rechts, leicht farbiger Rand */
  --lq-rim:inset 1px 1px 0 rgba(255,255,255,.2),inset -1px -1px 0 rgba(0,0,0,.24);
  --lq-ring:linear-gradient(140deg,rgba(255,255,255,.62),rgba(159,240,255,.32) 22%,rgba(255,255,255,.06) 46%,rgba(240,171,252,.22) 74%,rgba(255,255,255,.36));
  --bg-ph:url("data:image/jpeg;base64,/9j/4AAQSkZJRgABAgAHhQdKAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb//gAPTGF2YzYzLjEuMTAyAP/bAEMACBAQExATFhYWFhYWGhgaGxsbGhoaGhsbGx0dHSIiIh0dHRsbHR0gICIiJSYlIyMiIyYmKCgoMDAuLjg4OkVFU//EAGUAAAMBAQEAAAAAAAAAAAAAAAYFBwMCBAEBAQAAAAAAAAAAAAAAAAAAAwIQAAEDAwQCAwEBAAAAAAAAAAECEQMABCESUUETMjGBkQUiwREAAwEBAAAAAAAAAAAAAAAAABEBITH/wAARCAAWACADASIAAhEAAxEA/9oADAMBAAIRAxEAPwCPWtmu5LBgAzk+g+K1mszCopJcjaiv8tYmQqPxKQGVn0+QpuNjlqJ02E1wWkQVYKkqRpJVjjPOKtyUlVYR7qNc9RqkLtYUjy/p20EMt9m/31Xl1WkCT2o7FZ8FYGwJbT9GkwN0Cba5ltZBJGplD6I2NFqv1J5Q6VKSHJZwz/AzQGKbQ+Bo0K8GE9/LMgIZKQ/sAaieSVM/wMUm1lmrk8VnS8D6f//Z");
  color-scheme:dark; scrollbar-color:rgba(255,255,255,.26) transparent;
}
@media (max-width:900px){:root[data-theme="glas"]{--glass-blur:blur(22px) saturate(165%)}}
@media (min-width:901px) and (max-width:1180px){:root[data-theme="glas"]{--rail-w:92px}}
/* „Transparenz reduzieren“ (Systemeinstellung) bzw. Browser ohne backdrop-filter: deckendere Flächen, Text bleibt lesbar */
@media (prefers-reduced-transparency:reduce){:root[data-theme="glas"]{--rail:rgba(14,22,34,.94);--panel:rgba(24,34,50,.94);--glass:rgba(24,34,50,.94);--glass-strong:rgba(16,24,37,.98);--glass-bar:rgba(11,18,30,.96)}}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){:root[data-theme="glas"]{--rail:rgba(14,22,34,.88);--panel:rgba(22,32,48,.86);--glass:rgba(22,32,48,.86);--glass-strong:rgba(16,24,37,.96);--glass-bar:rgba(11,18,30,.92)}}

/* Bergfoto als feste Ebene unter allem (kein background-attachment:fixed – iOS); winziges Vorschaubild darunter, dunkler Verlauf darüber */
:root[data-theme="glas"] body{background:var(--ground)}
:root[data-theme="glas"] body::before{content:"";position:fixed;left:0;right:0;top:0;height:100vh;height:100lvh;z-index:-1;pointer-events:none;
  background:linear-gradient(180deg,rgba(5,10,20,.34),rgba(5,10,20,.14) 38%,rgba(5,10,20,.6)),url("/logos/cockpit-bg.jpg?v=1") 50% 35%/cover no-repeat,var(--bg-ph) 50% 35%/cover no-repeat,var(--ground)}
@media (max-width:700px),(orientation:portrait) and (max-width:1100px){
  :root[data-theme="glas"] body::before{background:linear-gradient(180deg,rgba(5,10,20,.44),rgba(5,10,20,.12) 34%,rgba(5,10,20,.62)),url("/logos/cockpit-bg-m.jpg?v=1") 50% 30%/cover no-repeat,var(--bg-ph) 50% 30%/cover no-repeat,var(--ground)}
}
:root[data-theme="glas"] ::selection{background:var(--sel);color:var(--ink)}
:where(:root[data-theme="glas"]) .head h1,:where(:root[data-theme="glas"]) .head p{text-shadow:0 1px 16px rgba(0,0,0,.3)}

/* Glasflächen der obersten Ebene – verschachtelte Boxen bleiben flach (var(--sunk), keine zweite Unschärfe).
   Spezifität bewusst niedrig (:where), damit Module Farbe/Rand/Radius selbst bestimmen können; die Unschärfe kommt von hier. */
:where(:root[data-theme="glas"]) :is(.panel,.fsd-card,.fsm-card,.sb,.tk-kpi,.mx-card,.w-card):not(:where(.mread,.view-post *,.view-kal *,.mbox *,.kd *,.kmtodo *,.dialog *,.drawer *,.modal *,.cmdk *,.nmenu *,.kichat *,.glass *,.panel *,.fsd-card *,.fsm-card *,.sb *,.tk-kpi *,.mx-card *,.w-card *,.tk-col *)),
:where(:root[data-theme="glas"]) .glass:not(:where(.glass *,.panel *,.dialog *,.drawer *,.modal *,.cmdk *,.nmenu *)){
  background:var(--glass);border:1px solid var(--glass-line);border-radius:var(--r);box-shadow:var(--glass-hi),var(--shadow);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
:where(:root[data-theme="glas"]) .day>button:not(:where(.panel *,.dialog *,.drawer *,.glass *)){background:var(--glass);border-color:var(--glass-line);box-shadow:var(--glass-hi),var(--shadow);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}
:where(:root[data-theme="glas"]) .day>button:hover{background:rgba(255,255,255,.13);border-color:var(--line-2)}
:where(:root[data-theme="glas"]) :where(.panel,.glass,.fsd-card,.fsm-card,.sb,.mx-card,.w-card,.dialog,.drawer) .panel{background:var(--sunk);border-color:var(--line);box-shadow:none;border-radius:16px}

/* Knöpfe: Glas-Pillen; Haupt-Aktion = weiße Pille mit dunkler Schrift, .btn.glow = Cyan */
:where(:root[data-theme="glas"]) .btn{background:var(--panel-2);border-color:var(--glass-line);border-radius:99px;color:var(--ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);transition:transform .3s cubic-bezier(.3,1.6,.5,1),background-color .15s,border-color .15s}
:where(:root[data-theme="glas"]) .btn:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.32)}
:where(:root[data-theme="glas"]) .btn:active{transform:scale(.97)}
:where(:root[data-theme="glas"]) .btn.primary{background:var(--btn-pri);border-color:var(--btn-pri);color:var(--btn-pri-ink);font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.2)}
:where(:root[data-theme="glas"]) .btn.primary:hover{filter:none;background:#e6f9ff;border-color:#e6f9ff}
:where(:root[data-theme="glas"]) .btn.glow{background:var(--glow);border-color:var(--glow);color:var(--on-glow)}
:where(:root[data-theme="glas"]) .btn.glow:hover{background:var(--glow-ink);border-color:var(--glow-ink)}
:where(:root[data-theme="glas"]) .btn.danger{background:var(--bad);border-color:var(--bad);color:var(--ground)}
:where(:root[data-theme="glas"]) .btn:disabled{transform:none}
:where(:root[data-theme="glas"]) :is(option,optgroup){background-color:var(--panel-solid);color:var(--ink)}
:where(:root[data-theme="glas"]) .sheet .nav-btn:hover{background:var(--hover)}
:where(:root[data-theme="glas"]) .sheet .nav-btn[aria-current="page"]{background:var(--glow-soft);color:var(--glow-ink)}
:where(:root[data-theme="glas"]) .toast .ta{color:var(--glow)}
/* Hinweisbalken: dunkler Grund unter der Warnfarbe, damit weiße Schrift auch über hellen Bergflächen lesbar bleibt */
:where(:root[data-theme="glas"]) .notice{background:color-mix(in srgb,var(--warn) 15%,rgba(16,24,37,.6));border-color:color-mix(in srgb,var(--warn) 38%,transparent)}
:where(:root[data-theme="glas"]) .view>.notice{-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur)}

/* Overlays: kräftiges Glas (Dialog, Seitenblatt, Menüs, Hinweis) */
:where(:root[data-theme="glas"]) .scrim{background:rgba(4,9,16,.42)}
:where(:root[data-theme="glas"]) .modal{background:rgba(4,9,16,.4);-webkit-backdrop-filter:blur(10px) saturate(130%);backdrop-filter:blur(10px) saturate(130%)}
:where(:root[data-theme="glas"]) .dialog{background:var(--glass-strong);border:1px solid var(--glass-line);border-radius:26px;box-shadow:var(--glass-hi),var(--shadow-pop)}
:where(:root[data-theme="glas"]) .drawer{background:var(--glass-strong);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);border:1px solid var(--glass-line);box-shadow:var(--glass-hi),-18px 0 60px rgba(0,0,0,.35)}
:where(:root[data-theme="glas"]) .drawer:not(.on){box-shadow:none}
@media (min-width:901px){
  :where(:root[data-theme="glas"]) .drawer{top:12px;right:12px;bottom:12px;border-radius:28px;transform:translateX(calc(100% + 32px))}
  :where(:root[data-theme="glas"]) .drawer.on{transform:none}
}
:where(:root[data-theme="glas"]) .nmenu{border-color:var(--glass-line);border-radius:18px;box-shadow:var(--glass-hi),var(--shadow-pop);transform-origin:100% 0;animation:lqPop .22s cubic-bezier(.3,1.4,.5,1)}
:where(:root[data-theme="glas"]) .nmenu button{border-radius:11px}
:where(:root[data-theme="glas"]) .nmenu button:hover,:where(:root[data-theme="glas"]) .nmenu button:focus-visible{background:var(--hover)}
:where(:root[data-theme="glas"]) .nmenu button svg{color:var(--glow)}
@keyframes lqPop{from{opacity:0;transform:scale(.94) translateY(-4px)}}
@media (prefers-reduced-motion:reduce){:where(:root[data-theme="glas"]) .nmenu{animation:none}}
:where(:root[data-theme="glas"]) .toast{background:var(--glass-strong);color:var(--ink);border:1px solid var(--glass-line);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--glass-hi),0 14px 40px rgba(0,0,0,.35);border-radius:99px}
:where(:root[data-theme="glas"]) .toast.bad{background:color-mix(in srgb,var(--bad) 30%,rgba(16,24,37,.9));color:var(--ink);border-color:color-mix(in srgb,var(--bad) 55%,transparent)}

/* Seitenleiste: schwebendes Liquid-Glas-Panel (14px Abstand zu den Rändern), Glanz folgt dem Zeiger (--mx/--my aus core.js) */
:where(:root[data-theme="glas"]) .rail{top:calc(14px + env(safe-area-inset-top,0px));height:calc(100vh - 28px - env(safe-area-inset-top,0px));margin:calc(14px + env(safe-area-inset-top,0px)) 0 14px 14px;border:0;border-radius:28px;background:var(--rail);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);box-shadow:var(--lq-rim),0 24px 60px rgba(0,0,0,.3)}
:where(:root[data-theme="glas"]) :is(.rail,.tabbar)::before{content:"";position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 26%)}
:where(:root[data-theme="glas"]) .lq-glare{display:block;position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--mx,22%) var(--my,-40px),rgba(255,255,255,.14),transparent 70%)}
:where(:root[data-theme="glas"]) :is(.rail,.tabbar)::after,:where(:root[data-theme="glas"]) .lq-drop>i::after{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit;padding:1px;pointer-events:none;background:var(--lq-ring);
  -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);mask-composite:exclude}
:where(:root[data-theme="glas"]) .rail-in{padding:16px 12px 12px}
/* Statusleiste (iPhone/iPad-App, durchscheinend): dunkler Verlauf darunter, damit Uhrzeit/Akku über hellem Foto lesbar bleiben (Höhe 0 am Mac) */
:root[data-theme="glas"] body::after{content:"";position:fixed;left:0;right:0;top:0;height:env(safe-area-inset-top,0px);z-index:34;pointer-events:none;background:linear-gradient(180deg,rgba(5,10,20,.55),rgba(5,10,20,.2))}
:where(:root[data-theme="glas"]) .brand{padding:4px 10px 14px}
:where(:root[data-theme="glas"]) .brand .bm{border-radius:11px;background:linear-gradient(140deg,#fff,var(--glow));color:var(--on-glow);box-shadow:0 4px 14px rgba(159,240,255,.25),inset 0 1px 0 rgba(255,255,255,.8)}
:where(:root[data-theme="glas"]) .nav-g{color:var(--ink-3);padding:14px 12px 5px;font-size:10.5px;letter-spacing:.14em}
:where(:root[data-theme="glas"]) .rail .nav-btn{min-height:36px;padding:7px 12px;border-radius:13px;color:var(--ink-2);font-weight:500}
:where(:root[data-theme="glas"]) .rail .nav-btn:hover{color:var(--ink);background:var(--hover)}
:where(:root[data-theme="glas"]) .rail .nav-btn[aria-current="page"]{color:var(--ink);font-weight:700;background:var(--active);box-shadow:none}
:where(:root[data-theme="glas"]) .rail .nav-btn[aria-current="page"] svg{color:var(--glow);filter:drop-shadow(0 0 6px rgba(159,240,255,.45))}
:where(:root[data-theme="glas"]) .rail .nav-btn[aria-current="page"]::before{content:"";position:absolute;left:3px;top:50%;width:3px;height:16px;margin-top:-8px;border-radius:3px;background:var(--glow);box-shadow:0 0 10px var(--glow)}
:where(:root[data-theme="glas"]) .rail .nav-btn:focus-visible{outline:2px solid var(--glow);outline-offset:-2px;border-radius:13px}
:where(:root[data-theme="glas"]) .rail-set{padding:10px 2px 8px}
:where(:root[data-theme="glas"]) .rail-set select{height:34px;border-radius:12px;border:1px solid var(--line);background-color:var(--panel-solid);color:var(--ink-2)}
:where(:root[data-theme="glas"]) .rail-user{border-top:1px solid var(--line);padding:12px 6px 2px;gap:8px}
:where(:root[data-theme="glas"]) .ru-av{background:linear-gradient(140deg,rgba(255,255,255,.28),rgba(255,255,255,.08));box-shadow:inset 0 1px 0 rgba(255,255,255,.35);color:var(--ink)}
:where(:root[data-theme="glas"]) .ru-out{width:32px;height:32px;border-radius:50%}
:where(:root[data-theme="glas"]) .ru-out:hover,:where(:root[data-theme="glas"]) .ru-me:hover{background:var(--hover);color:var(--ink)}
:where(:root[data-theme="glas"]) .ru-dot{box-shadow:0 0 0 2px rgba(14,22,34,.9),0 0 8px var(--bad)}
/* Mittlere Breite (nur Symbole): gleiche Glas-Leiste, schmal */
@media (min-width:901px) and (max-width:1180px){
  :where(:root[data-theme="glas"]) .rail-in{padding:14px 8px 10px}
  :where(:root[data-theme="glas"]) .brand{padding:2px 0 10px}
  :where(:root[data-theme="glas"]) .nav-g{font-size:0;padding:6px 0 4px;margin:6px 12px 0}
  :where(:root[data-theme="glas"]) .rail .nav-btn{justify-content:center;padding:0;min-height:44px}
  :where(:root[data-theme="glas"]) .rail-user{padding:10px 0 0;gap:6px}
}
/* Tropfen (aktiver Eintrag): Glas-Linse mit Lichtkante, Glanzpunkt folgt dem Zeiger (--dx/--dy) */
:where(:root[data-theme="glas"]) :is(.rail,.tabbar) .lq-drop>i{border-radius:13px;background:linear-gradient(180deg,rgba(255,255,255,.22),rgba(255,255,255,.09));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),inset 1px 0 0 rgba(255,255,255,.14),inset -1px -1px 0 rgba(0,0,0,.18),0 8px 22px rgba(0,0,0,.22)}
:where(:root[data-theme="glas"]) .lq-drop>i::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120px circle at var(--dx,26%) var(--dy,-30%),rgba(255,255,255,.42),transparent 60%);opacity:.75}
:where(:root[data-theme="glas"]) :is(.rail,.tabbar) .lq-drop.away>i{background:linear-gradient(180deg,rgba(255,255,255,.14),rgba(255,255,255,.05));box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 6px 16px rgba(0,0,0,.14)}
:where(:root[data-theme="glas"]) .lq-drop.drag>i{background:linear-gradient(180deg,rgba(255,255,255,.28),rgba(255,255,255,.12))}
/* Brechung (nur Chromium, von core.js erkannt): SVG-Verschiebung der Kanten statt reiner Unschärfe; Safari behält blur+saturate */
:where(:root[data-theme="glas"].lq-refract) .rail{backdrop-filter:url(#lqRail) blur(12px) saturate(175%) brightness(1.04)}

/* Kopfzeile: oben durchsichtig, beim Scrollen eigenes Glas; Suche als Glas-Pille, runde Glas-Knöpfe, „+ Neu“ als weiße Pille */
:where(:root[data-theme="glas"]) .topbar{gap:10px;background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none;transition:background-color .25s,box-shadow .25s}
:where(:root[data-theme="glas"].is-scrolled) .topbar{background:var(--glass-bar);-webkit-backdrop-filter:var(--bar-blur);backdrop-filter:var(--bar-blur);box-shadow:0 1px 0 var(--line)}
:where(:root[data-theme="glas"]) .tb-search{height:44px;border-radius:22px;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink-2);box-shadow:var(--glass-hi),0 8px 24px rgba(0,0,0,.16);
  -webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);transition:background-color .2s,border-color .2s,transform .35s cubic-bezier(.3,1.6,.5,1)}
:where(:root[data-theme="glas"]) .tb-search:hover{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.3)}
:where(:root[data-theme="glas"]) .tb-search kbd{border-color:var(--line-2);color:var(--ink-3)}
:where(:root[data-theme="glas"]) .topbar .rail-foot .rf-ic,:where(:root[data-theme="glas"]) .topbar .tb-i{width:44px;height:44px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);color:var(--ink);
  box-shadow:var(--glass-hi),0 8px 24px rgba(0,0,0,.16);-webkit-backdrop-filter:var(--glass-blur);backdrop-filter:var(--glass-blur);transition:transform .35s cubic-bezier(.3,1.6,.5,1),background-color .2s,border-color .2s}
:where(:root[data-theme="glas"]) .topbar .rail-foot .rf-ic:hover,:where(:root[data-theme="glas"]) .topbar .tb-i:hover{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.32);color:var(--ink)}
:where(:root[data-theme="glas"]) .topbar .rail-foot .rf-ic[aria-pressed="true"]{color:var(--glow);border-color:rgba(159,240,255,.45)}
:where(:root[data-theme="glas"]) .topbar .rail-foot .rf-new{width:auto;padding:0 16px;border-radius:22px;background:var(--glow-soft);color:var(--glow-ink);border-color:rgba(159,240,255,.35)}
:where(:root[data-theme="glas"]) .topbar .rail-foot .rf-new:hover{background:rgba(159,240,255,.24);color:var(--glow-ink)}
:where(:root[data-theme="glas"]) .tb-new{height:44px;border-radius:22px;padding:0 20px;background:var(--btn-pri);color:var(--btn-pri-ink);font-weight:800;
  box-shadow:0 8px 24px rgba(0,0,0,.22);transition:transform .35s cubic-bezier(.3,1.6,.5,1),background-color .2s}
:where(:root[data-theme="glas"]) .tb-new:hover{filter:none;background:#e6f9ff}
:where(:root[data-theme="glas"]) :is(.tb-new,.tb-search,.tb-i,.rf-ic):active{transform:scale(.95)}

/* Statusleiste rechts (zside): Spalte durchsichtig, die Kästen sind Glas */
:root[data-theme="glas"] .app.has-side .side{background:transparent;border-left:0}
/* Modul-Regeln mit !important, die im Glas-Look unlesbar wären (Finanzen: dunkles Navy beim Darüberfahren, Postfach: weiß auf Cyan) */
:root[data-theme="glas"] body .fsd .btn.primary:hover{background:var(--glow)!important;filter:brightness(1.08)}

<body>
<!-- Splashscreen beim Öffnen des Cockpits (Wunsch Simon 24.10.2026): animiert, mit wechselndem derben Spruch.
     Wird vom Server direkt hinter <body> eingesetzt, damit er vor den Modulen erscheint. Antippen überspringt.
     Bleibt mind. 2,8 s (Spruch lesen), verschwindet sobald die Daten da sind, spätestens nach 7,5 s. -->
<div id="fsSplash" aria-hidden="true">
  <div class="sp-blob a"></div><div class="sp-blob b"></div><div class="sp-blob c"></div>
  <div class="sp-core">
    <div class="sp-logo"><span class="sp-ring"></span><span class="sp-ring r2"></span><img src="/logos/cockpit-icon-512.png" alt=""></div>
    <div class="sp-name"><span>F</span><span>S</span><span>&nbsp;</span><span>C</span><span>o</span><span>c</span><span>k</span><span>p</span><span>i</span><span>t</span></div>
    <p class="sp-quote" id="fsSplashQ"></p>
  </div>
  <div class="sp-bar"><i></i></div>
</div>
<style>
#fsSplash{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;overflow:hidden;background:#07090f;color:#fff;font-family:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;
  transition:opacity .55s ease,transform .55s cubic-bezier(.6,0,.2,1),filter .55s ease}
#fsSplash.out{opacity:0;transform:scale(1.08);filter:blur(6px);pointer-events:none}
html[data-theme="light"] #fsSplash{background:#f4f5fb;color:#11131a}
.sp-blob{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(70px);opacity:.55;mix-blend-mode:screen;animation:spBlob 7s ease-in-out infinite alternate}
html[data-theme="light"] .sp-blob{mix-blend-mode:multiply;opacity:.35}
.sp-blob.a{background:radial-gradient(circle,#6c63ff 0,transparent 60%);left:-30vmax;top:-25vmax}
.sp-blob.b{background:radial-gradient(circle,#ff4d8d 0,transparent 60%);right:-35vmax;top:10vmax;animation-delay:-2s;animation-duration:9s}
.sp-blob.c{background:radial-gradient(circle,#18c5a8 0,transparent 60%);left:-10vmax;bottom:-40vmax;animation-delay:-4s;animation-duration:8s}
@keyframes spBlob{0%{transform:translate(0,0) scale(1)}50%{transform:translate(8vmax,6vmax) scale(1.15)}100%{transform:translate(-6vmax,10vmax) scale(.95)}}
.sp-core{position:relative;display:grid;justify-items:center;gap:22px;padding:0 28px;max-width:560px;text-align:center}
.sp-logo{position:relative;width:104px;height:104px;margin-bottom:10px;animation:spPop .9s cubic-bezier(.2,1.6,.4,1) both}
.sp-logo img{position:relative;width:100%;height:100%;border-radius:26px;box-shadow:0 18px 50px rgba(108,99,255,.45);animation:spFloat 3s ease-in-out .9s infinite}
.sp-ring{position:absolute;inset:-10px;border-radius:34px;border:2px solid rgba(140,130,255,.55);animation:spRing 1.8s ease-out .5s infinite}
.sp-ring.r2{animation-delay:1.4s}
@keyframes spPop{0%{transform:scale(.2) rotate(-25deg);opacity:0}60%{opacity:1}100%{transform:scale(1) rotate(0)}}
@keyframes spFloat{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-2deg)}}
@keyframes spRing{0%{transform:scale(.9);opacity:.9}100%{transform:scale(1.55);opacity:0}}
.sp-name{display:flex;font-weight:800;font-size:26px;letter-spacing:-.02em}
.sp-name span{display:inline-block;opacity:0;transform:translateY(14px);animation:spUp .5s cubic-bezier(.2,.9,.3,1.3) forwards}
.sp-name span:nth-child(1){animation-delay:.35s}.sp-name span:nth-child(2){animation-delay:.4s}.sp-name span:nth-child(3){animation-delay:.45s}.sp-name span:nth-child(4){animation-delay:.5s}.sp-name span:nth-child(5){animation-delay:.55s}
.sp-name span:nth-child(6){animation-delay:.6s}.sp-name span:nth-child(7){animation-delay:.65s}.sp-name span:nth-child(8){animation-delay:.7s}.sp-name span:nth-child(9){animation-delay:.75s}.sp-name span:nth-child(10){animation-delay:.8s}
@keyframes spUp{to{opacity:1;transform:none}}
.sp-quote{margin:0;min-height:3.2em;font-size:19px;line-height:1.45;font-weight:600;color:rgba(255,255,255,.92);text-wrap:balance}
html[data-theme="light"] .sp-quote{color:#20232d}
.sp-quote i{display:inline-block;font-style:normal;opacity:0;filter:blur(8px);transform:translateY(8px) scale(.96);animation:spWord .45s cubic-bezier(.2,.8,.2,1) forwards;margin-right:.26em}
@keyframes spWord{to{opacity:1;filter:none;transform:none}}
.sp-bar{position:absolute;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));width:140px;height:4px;margin-left:-70px;border-radius:9px;background:rgba(255,255,255,.12);overflow:hidden}
html[data-theme="light"] .sp-bar{background:rgba(0,0,0,.08)}
.sp-bar i{position:absolute;inset:0;width:40%;border-radius:9px;background:linear-gradient(90deg,#6c63ff,#ff4d8d);animation:spBar 1.1s ease-in-out infinite}
@keyframes spBar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
/* Alpenglas: Bergfoto statt Neon-Flecken, Cyan statt Indigo/Pink (gleiches Bild wie der Hintergrund, wird vorgeladen) */
html[data-theme="glas"] #fsSplash{background:#0b1220 url("/logos/cockpit-bg.jpg?v=1") 50% 35%/cover no-repeat}
@media (max-width:700px),(orientation:portrait) and (max-width:1100px){html[data-theme="glas"] #fsSplash{background:#0b1220 url("/logos/cockpit-bg-m.jpg?v=1") 50% 30%/cover no-repeat}}
html[data-theme="glas"] #fsSplash:before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,20,.45),rgba(5,10,20,.25) 45%,rgba(5,10,20,.7))}
html[data-theme="glas"] .sp-blob{display:none}
html[data-theme="glas"] .sp-logo img{box-shadow:0 18px 50px rgba(0,0,0,.4),0 0 40px rgba(159,240,255,.25)}
html[data-theme="glas"] .sp-ring{border-color:rgba(159,240,255,.6)}
html[data-theme="glas"] .sp-quote{text-shadow:0 1px 18px rgba(0,0,0,.4)}
html[data-theme="glas"] .sp-bar{background:rgba(255,255,255,.16)}
html[data-theme="glas"] .sp-bar i{background:linear-gradient(90deg,#9ff0ff,#fff)}
@media (prefers-reduced-motion:reduce){#fsSplash *{animation-duration:.01s!important;animation-iteration-count:1!important}.sp-quote i,.sp-name span{opacity:1;filter:none;transform:none}}
</style>
<script>
(function(){
  var S=document.getElementById("fsSplash"); if(!S) return;
  var Q=["Kaffee rein, Mist raus, Rechnungen schreiben.","Die Rechnungen schreiben sich leider nicht von selbst.","Montag ist auch nur ein Sonntag mit Arschkarte.","Wer kann, der kann. Wer nicht kann, braucht ein Cockpit.","Der Kunde ist König. Aber der König zahlt pünktlich.","Nicht geschimpft ist genug gelobt.","Heute ist ein guter Tag, um säumige Kunden zu nerven.","Gut ist gut genug – den Rest regelt der liebe Gott.","Chef, Buchhalter und Putzkraft in einer Person. Respekt.","Wer früh aufsteht, hat mehr Zeit zum Fluchen.","Das Finanzamt schläft nie. Du schon. Also ran an die Arbeit.","Deadline? Klingt nach einem Problem für Zukunfts-Simon.","Erst die Arbeit, dann das Bier. Oder umgekehrt, wir sind flexibel.","Fehler sind Features, die noch keiner bezahlt hat.","Wer nichts tut, dem passiert nichts. Wer was tut, verdient was.","Lächeln. Der Kunde will eh wieder alles anders.","Mach es richtig oder lass es bleiben.","Heute wird nicht gejammert, heute wird abgerechnet.","Gesund bleiben, Rechnung schreiben.","Logo größer machen kostet extra. Merk dir das.","„Kannst du nicht schnell noch eine Website machen?“ – Nein. Rechnung.","Nicht jeder Held trägt Umhang. Manche tragen Jogginghose im Homeoffice.","Wenn du nicht weiterweißt, mach eine Liste. Dann ignorier sie.","Wer bremst, verliert. Wer zahlt, gewinnt.","So ein Krampf – aber ein guter Krampf.","Die UVA wartet. Die UVA wartet immer.","Steuern zahlen ist wie Zahnarzt: tut weh, muss aber sein.","Alles easy, alles super, alles abgerechnet.","Wenn es leicht wäre, würde es jeder Depp machen.","Kaffee ist mein Betriebsmittel.","Arbeit adelt. Wir bleiben trotzdem bürgerlich.","Noch eine Mail und ich raufe mir die Haare. Gut, dass keine mehr da sind.","Nur die Harten kommen in den Garten – die Weichen in die Buchhaltung.","Das Cockpit ist fertig. Du noch nicht.","Profis machen es für Geld. Amateure für „Sichtbarkeit“.","Kostet nichts? Dann ist es auch nichts wert.","Pass auf, gleich kommt wieder jemand mit „Kannst du mal kurz …“.","Schnell, billig, gut – such dir zwei aus.","Du bist nicht müde, du bist unterkoffeiniert.","Heute schon was abgerechnet oder nur Mails gelesen?","Los geht's, das Geld kommt nicht von allein.","Ich bin nicht faul, ich bin im Energiesparmodus.","Berge, Kaffee, Rechnungen. Die heilige Dreifaltigkeit.","Ausreden kosten extra.","Wir sind wir, und die Mahnung geht heute raus.","Der frühe Vogel kann mich mal.","Wenn es brennt, brennt es eben. Hauptsache nicht die Festplatte.","Lieber reich und gesund als arm und krank.","Kunde will es bis gestern? Dann hätte er vorgestern anrufen sollen.","Zahlungsziel 14 Tage heißt nicht 14 Wochen, Schätzchen.","Heute wird geschafft, nicht geschlafen.","Das Leben ist zu kurz für schlechte Schriftarten.","Comic Sans? Nicht in meinem Haus.","Wer anderen eine Grube gräbt, bekommt eine Baggerrechnung.","Augen auf, Hirn an, Rechnung raus.","Es ist, wie es ist, und es wird schon.","Wer nichts wagt, gewinnt nichts – außer Ruhe.","Pfusch am Bau ist Tradition. Pfusch im Code nicht.","Ich habe kein Problem, ich habe eine Lösung, die noch nicht bezahlt ist.","Kreativität ist, wenn man trotzdem lacht.","Jeder Euro zählt. Außer der fürs Parken.","Das Postfach ist voll. Der Kopf auch. Weiter geht's.","Nur wer arbeitet, macht Fehler. Ich mache viele, also bin ich fleißig.","Sieht gut aus, Chef. Also du. Du bist der Chef.","Gestern Website, heute Rechnung, morgen Skifahren.","Nicht lang schnacken, Kopf in den Nacken.","Mehr Umsatz, weniger Theater.","Kein Stress, nur verdammt viel zu tun.","Wer schreibt, der bleibt. Wer abrechnet, der lebt.","Mach eine Pause. Aber nicht zu lang, klar?","Lieber eine ordentliche Rechnung als eine hässliche Website.","Verdammt, schon wieder so spät.","Pixel schieben ist auch Sport.","Dein Konto will heute gefüttert werden.","Was nicht passt, wird passend gemacht. Oder neu berechnet.","Die beste Mail ist die, auf die man nicht antworten muss.","Heute ist Zahltag. Hoffentlich nicht nur für die anderen.","Umsonst ist nur der Tod, und der kostet das Leben.","Kunden kommen und gehen. Rechnungen bleiben – bis sie bezahlt sind.","Erfolg ist, wenn es trotz Montag läuft.","Mund abwischen, weitermachen.","Wer nichts weiß, muss alles glauben. Wer alles weiß, hat ein Cockpit.","Fertig ist es, wenn es abgerechnet ist.","Gibt dir das Leben Zitronen: Rechnung für die Zitronen schreiben.","Schau nicht so, das ist ein Dashboard und kein Spiegel.","Ein bisschen was geht immer.","Neue Woche, neues Glück, alte Mails.","Das wird kein Meeting, das wird eine Mail. Und die ignorieren wir.","Ruhe bewahren und Backup machen.","Wo gehobelt wird, da fallen Rechnungen.","Ich mag Kunden. Vor allem die, die zahlen.","Sprüche klopfen, Umsatz machen.","Nimm es leicht – das Schwere trägt der Steuerberater.","Keine Zeit zum Jammern, zu viel zu tun.","Hirn an, Handy lautlos, los geht's.","Das wird großartig. Irgendwann. Ganz bestimmt.","Heute schon gerechnet? Nein? Dann wird's Zeit.","Wenn das Geld nicht kommt, kommt die Mahnung.","Wer zahlt, schafft an. Wer nicht zahlt, bekommt Post.","Bergluft, Bildschirm, Buchhaltung.","Ohne Fleiß kein Preis, ohne Preis kein Fleiß.","Meine Güte, ist das ein Tag heute.","Gönn dir. Aber erst nach der UVA.","Die Konkurrenz schläft nicht. Sie baut nur schlechtere Websites.","Wenn du denkst, es geht nicht mehr, kommt irgendwo eine Rechnung her.","Alles gut, solange der Server läuft.","Deine To-do-Liste hat Angst vor dir. Hoffentlich.","Kunde: „Nur eine Kleinigkeit.“ Spoiler: Es ist keine Kleinigkeit.","Weniger Meetings, mehr Moneten.","Durchatmen, Kaffee, Weltherrschaft.","Erst denken, dann klicken. Meistens.","Das Leben ist kein Ponyhof, aber wir haben ein Cockpit.","Aufstehen, Krone richten, Rechnung schicken."];
  var k="fsc_splash_q2", seen=[]; try{ seen=JSON.parse(localStorage.getItem(k)||"[]"); }catch(e){}
  var pool=[]; for(var i=0;i<Q.length;i++) if(seen.indexOf(i)<0) pool.push(i); if(!pool.length){ pool=Q.map(function(_,i){return i;}); seen=[]; }
  var pick=pool[Math.floor(Math.random()*pool.length)]; seen.push(pick); try{ localStorage.setItem(k,JSON.stringify(seen)); }catch(e){}
  var el=document.getElementById("fsSplashQ"); Q[pick].split(" ").forEach(function(w,n){ var i=document.createElement("i"); i.textContent=w; i.style.animationDelay=(0.9+n*0.075)+"s"; el.appendChild(i); });
  var t0=Date.now(), done=false;
  function hide(){ if(done) return; done=true; S.classList.add("out"); setTimeout(function(){ if(S.parentNode) S.parentNode.removeChild(S); },600); }
  function ready(){ var m=document.getElementById("main"); return m&&!m.querySelector(".loading"); }
  var minMs=2800+Q[pick].split(" ").length*75;
  (function tick(){ if(done) return; var t=Date.now()-t0; if((t>minMs&&ready())||t>7500) hide(); else setTimeout(tick,120); })();
  S.addEventListener("click",hide);
})();
</script>

    </div>

  </header>
  <main id="main"><div class="loading">Lade deine Daten …</div></main>

</div>
